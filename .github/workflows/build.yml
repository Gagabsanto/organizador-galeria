      - name: Instalar Capacitor e gerar Android
        shell: bash
        run: |
          set -e
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "Organizador de Galeria" com.tobias.galeria --web-dir www
          npx cap add android
          npx cap sync android

      - name: Instalar ML Kit e permissões de galeria
        shell: bash
        run: |
          set -e
          GRADLE=android/app/build.gradle
          sed -i '/^dependencies[[:space:]]*{/a\    implementation "com.google.mlkit:image-labeling:17.0.9"' "$GRADLE"

          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />' "$MANIFEST"
          sed -i '/<\/application>/i\        <activity android:name=".ConfirmMediaActivity" android:exported="false" />' "$MANIFEST"

          mkdir -p android/app/src/main/java/com/tobias/galeria
          cp GaleriaPlugin.java android/app/src/main/java/com/tobias/galeria/GaleriaPlugin.java
          cp ConfirmMediaActivity.java android/app/src/main/java/com/tobias/galeria/ConfirmMediaActivity.java
          cp MainActivity.java android/app/src/main/java/com/tobias/galeria/MainActivity.java

      - name: Verificações antes da compilação
        shell: bash
        run: |
          set -e
          node --check www/app.js
          grep -q 'com.google.mlkit:image-labeling:17.0.9' android/app/build.gradle
          grep -q 'ConfirmMediaActivity' android/app/src/main/AndroidManifest.xml
          grep -q 'GaleriaPlugin.class' android/app/src/main/java/com/tobias/galeria/MainActivity.java
          grep -q 'READ_MEDIA_VIDEO' android/app/src/main/AndroidManifest.xml
          grep -q 'miniatura' android/app/src/main/java/com/tobias/galeria/GaleriaPlugin.java

      - name: Montar o APK v8
        shell: bash
        run: |
          set -e
          cd android
          ./gradlew clean assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: galeria-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
