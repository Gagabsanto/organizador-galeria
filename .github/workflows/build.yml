name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Criar arquivos do app v8
        shell: bash
        run: |
          set -e
          mkdir -p www
          cat > www/index.html <<'FILE_index_html'
          <!doctype html>
          <html lang="pt-BR"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <link rel="stylesheet" href="style.css">
          </head><body>
          <div id="hd"><h1>Galeria</h1><p class="sub">Carregando…</p></div>
          <p id="m"></p><div id="pb"><i></i></div><div id="app"></div><p id="dx"></p>
          <div id="vw"><div id="vt"><button id="vx">✕</button><span id="vc"></span><button id="vd">🗑</button></div><img id="vim" alt=""><button id="vp">▶ Reproduzir</button></div>
          <script src="app.js"></script>
          </body></html>
          FILE_index_html
          cat > www/style.css <<'FILE_style_css'
          *{box-sizing:border-box}
          :root{color-scheme:dark}
          body{margin:0;font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1014;color:#edf3f6;padding:calc(env(safe-area-inset-top,0px) + 14px) 12px 44px}
          body.viewer-open{overflow:hidden}
          h1{font-size:1.55rem;margin:0;font-weight:800}.sub{color:#91a3ae;margin:3px 0 12px;font-size:.9rem}
          .row{display:flex;gap:8px;margin-bottom:10px}.row button{min-width:0}
          button{font:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}.pri,.sec{flex:1;border-radius:14px;padding:12px 10px;font-weight:800;font-size:.94rem}.pri{background:#3cc4b4;color:#06201d}.sec{background:#19262d;color:#edf3f6}button:disabled{opacity:.42}
          #m{color:#f2c46d;margin:7px 0;min-height:1.1em;font-size:.88rem}.sh{margin:21px 2px 8px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#8296a2;font-weight:800}
          #pb{display:none;height:5px;background:#18242a;border-radius:8px;overflow:hidden;margin:4px 0 9px}#pb i{display:block;height:100%;width:0;background:#3cc4b4;transition:width .12s linear}
          #dx{color:#52646f;font-size:.7rem;margin-top:25px}.albums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{position:relative;aspect-ratio:1;border-radius:15px;overflow:hidden;background:#141d23;padding:0;color:#fff;text-align:left;box-shadow:0 4px 16px rgba(0,0,0,.18)}.card img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}.card .t{position:absolute;left:0;right:0;bottom:0;padding:28px 8px 8px;background:linear-gradient(transparent,rgba(0,0,0,.86));display:flex;flex-direction:column}.card .t b{font-size:.77rem;line-height:1.16;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.card .t span{font-size:.68rem;color:#c4d1d8;margin-top:2px}
          .bar{display:flex;align-items:center;gap:7px;margin-bottom:12px}.back{background:#19262d;color:#edf3f6;border-radius:12px;padding:10px 11px;font-weight:800;white-space:nowrap}.bar h2{font-size:1rem;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.grid img{width:100%;aspect-ratio:1;object-fit:cover;background:#141d23;transition:opacity .15s,outline .12s}.grid img.on{outline:4px solid #3cc4b4;outline-offset:-4px;opacity:.58}.mais{width:100%;margin-top:12px;padding:13px;border-radius:13px;background:#19262d;color:#edf3f6;font-weight:700}
          #vw{position:fixed;left:0;top:0;right:0;bottom:0;background:#000;display:none;align-items:center;justify-content:center;z-index:99;touch-action:none}#vw img{max-width:100%;max-height:100%;object-fit:contain;transition:opacity .12s}.dang{background:#68232b!important;color:#ffdce0!important}
          #vt{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;background:linear-gradient(rgba(0,0,0,.75),transparent);z-index:2}#vt button{background:rgba(25,25,25,.65);color:#fff;border-radius:22px;padding:9px 14px;font-size:1rem;backdrop-filter:blur(5px)}#vc{color:#fff;font-size:.88rem;font-weight:700;text-shadow:0 1px 4px #000}
          @media(max-width:370px){.albums{gap:5px}.card{border-radius:11px}.back{padding:9px 8px;font-size:.88rem}}
          .vcell{position:relative}.vcell img{display:block}.vcell span{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.68);color:#fff;font-size:.68rem;font-weight:700;padding:1px 6px;border-radius:9px;pointer-events:none}#vp{display:none;position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);left:50%;transform:translateX(-50%);background:#3cc4b4;color:#06201d;font-weight:800;border-radius:28px;padding:14px 26px;font-size:1rem;z-index:3}
          FILE_style_css
          cat > www/app.js <<'FILE_app_js'
          var VER='v8',items=[],lim=600,tela=null,cur=null,selMode=false,SDK=0,lp=false,vlist=[],vi=0,tx=0,swipeY=0;
          var Galeria=(window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Galeria)||null;
          var PS={},VISTOS={},ROTULOS={},INFO='';
          try{PS=JSON.parse(localStorage.getItem('praia')||'{}');VISTOS=JSON.parse(localStorage.getItem('vistos')||'{}');ROTULOS=JSON.parse(localStorage.getItem('rotulos')||'{}')}catch(e){}
          function salvar(){try{localStorage.setItem('praia',JSON.stringify(PS));localStorage.setItem('vistos',JSON.stringify(VISTOS));localStorage.setItem('rotulos',JSON.stringify(ROTULOS))}catch(e){}}
          window.onerror=function(m){var e=document.querySelector('#m');if(e)e.textContent='Erro no app: '+m};
          function $(s){return document.querySelector(s)}
          function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
          function setm(t){$('#m').textContent=t}
          function cand(i){var a=[];if(i.u)a.push(i.u.indexOf('content://')===0?i.u:Capacitor.convertFileSrc(i.u));a.push(Capacitor.convertFileSrc(encodeURI(i.p).replace(/#/g,'%23').replace(/\?/g,'%3F')));a.push(Capacitor.convertFileSrc(i.p));return a}
          var TQ=[],TA=0,TC={};
          function setT(t,p){t.im.onerror=function(){if(t.done)t.done()};t.im.src=Capacitor.convertFileSrc(p)}
          function thumbV(i,im,done){var t={i:i,im:im,done:done},k=i.u||i.p;if(TC[k]){setT(t,TC[k]);return}if(!Galeria){if(done)done();return}TQ.push(t);tq()}
          function tq(){while(TA<3&&TQ.length){TA++;(function(t){var k=t.i.u||t.i.p;Galeria.miniatura({uri:t.i.u}).then(function(r){if(r&&r.path){TC[k]=r.path;setT(t,r.path)}else if(t.done)t.done()},function(){if(t.done)t.done()}).then(function(){TA--;tq()})})(TQ.shift())}}
          function fmtDur(ms){var s=Math.round((ms||0)/1000),m=Math.floor(s/60);s=s%60;return m+':'+(s<10?'0':'')+s}
          function wrapV(im,i){var w=el('div','vcell');w.appendChild(im);w.appendChild(el('span',0,'▶ '+fmtDur(i.dur)));return w}
          function load(i,im,done){if(i.v){thumbV(i,im,done);return}var c=cand(i),k=0;im.loading='lazy';im.alt='';im.onerror=function(){k++;if(k<c.length)im.src=c[k];else{i.bad=true;im.onerror=null;if(done)done()}};im.src=c[0]}
          function capa(list,im,from,n){while(from<list.length&&list[from].bad)from++;if(from>=list.length||n>6){im.style.display='none';return}load(list[from],im,function(){capa(list,im,from+1,n+1)})}
          function ehPrint(w,h){if(!tela||!w||!h)return false;var a=Math.max(w,h),b=Math.min(w,h),A=Math.max(tela.w,tela.h),B=Math.min(tela.w,tela.h);if(a===A&&b===B)return true;return Math.abs(a/b-A/B)<0.012&&a<=A*1.02&&a>=A*0.5}
          var CONV=/whatsapp|telegram|messenger|signal|discord|mensagens|messages|sms|chat|conversa/i;
          var GEN=/^(outros|camera|câmera|dcim|download|downloads|pictures|imagens|images|restored|documents|whatsapp.*|telegram.*|instagram|facebook|messenger|\d+)$/i;
          function baseAlbum(x){if(x.v)return 'Vídeos';var p=x.p||'',f=x.nome||p.split('/').pop(),rel=x.pasta||'',parts=p?p.split('/'):[],d=rel?rel.replace(/\\/g,'/').split('/').filter(Boolean).pop():(parts[parts.length-2]||'Outros');if(PS[p])return 'Praia';if(/^(sent|private)$/i.test(d))d=(parts[parts.length-3]||'Outros')+' · enviadas';if(/screenshot|captura/i.test(f)||/screenshots/i.test(p)){var m=f.match(/screenshot[_ -]?\d{8}[-_ ]?\d{4,6}[_ -](.+)\.\w+$/i);var app=m?m[1].replace(/[_-]+/g,' ').trim():'';if(CONV.test(app))return 'Prints · Conversas';return app?'Prints · '+app:'Prints'}if(ehPrint(x.w,x.h))return 'Prints recebidos';return d}
          var CAT={};
          (function(){function a(n,w,l){l.split('|').forEach(function(x){CAT[x]=[n,w]})}
          a('Praia',5,'beach|seashore');a('Praia',3,'coast|shore');a('Praia',2,'sand');
          a('Mar e rios',4,'ocean|sea|lake|river|waterfall|wave');a('Mar e rios',3,'pond|bay');a('Mar e rios',2,'water');
          a('Piscina',5,'swimming pool');a('Piscina',3,'pool');
          a('Pôr do sol',5,'sunset|sunrise');a('Pôr do sol',3,'dusk|dawn|twilight');
          a('Céu',1,'sky|cloud|atmosphere|horizon');
          a('Neve',5,'snow');a('Neve',3,'winter|ice|freezing');
          a('Montanhas',4,'mountain|volcano|mountain range|mountainous landforms');a('Montanhas',3,'hill|cliff|highland|ridge');
          a('Natureza',4,'forest|jungle|woodland|desert');a('Natureza',3,'nature|natural landscape|landscape|wilderness|field|meadow|grassland|cave|rock');a('Natureza',2,'tree|lawn|grass');
          a('Plantas e flores',5,'flower|bouquet|houseplant');a('Plantas e flores',4,'petal|garden');a('Plantas e flores',3,'plant|leaf');
          a('Selfies',5,'selfie');
          a('Crianças e bebês',5,'baby|toddler');a('Crianças e bebês',4,'child');
          a('Festas e eventos',5,'wedding|birthday|bride');a('Festas e eventos',4,'party|ceremony|celebration');
          a('Pessoas',3,'person|human|people|crowd|face|smile|head|hair|skin|eyebrow|forehead|chin|cheek|lip|nose|eyelash|facial expression|beard|neck|shoulder|arm|hand|finger|gesture|muscle|leg');
          a('Comida',5,'dish|cuisine|meal|dessert|cake|pizza|hamburger|sushi|recipe');a('Comida',4,'food|fast food|baked goods|fruit|vegetable|snack');a('Comida',3,'ingredient|tableware|bowl');
          a('Bebidas',5,'wine|beer|cocktail');a('Bebidas',4,'drink|beverage|coffee|juice|tea');a('Bebidas',2,'bottle|cup|glass');
          a('Cachorros',5,'dog|puppy|dog breed');a('Cachorros',2,'snout');
          a('Gatos',5,'cat|kitten|felidae|small to medium-sized cats');a('Gatos',3,'whiskers');
          a('Aves',5,'bird');a('Aves',3,'beak|feather');
          a('Animais',4,'wildlife|insect|butterfly|fish|horse|cattle|rabbit|reptile|zoo');a('Animais',3,'animal|pet|terrestrial animal');a('Animais',2,'mammal|carnivore|fur|tail|paw');
          a('Carros',5,'car|sports car');a('Carros',4,'motor vehicle|truck|bus');a('Carros',3,'vehicle|automotive design');a('Carros',2,'wheel|tire');
          a('Motos',5,'motorcycle|motorcycling');a('Bicicletas',5,'bicycle|bicycle wheel|cycling');
          a('Barcos',5,'boat|ship|yacht|watercraft');a('Aviões',5,'airplane|airliner|aircraft|aviation');
          a('Prédios e cidade',5,'cityscape|skyscraper|metropolis|castle');a('Prédios e cidade',4,'city|tower|bridge|urban area|landmark|monument|temple|church|place of worship');a('Prédios e cidade',3,'building|architecture|street|facade');
          a('Casas e interiores',5,'living room|bedroom|kitchen|bathroom|interior design');a('Casas e interiores',4,'house|home|couch|bed');a('Casas e interiores',3,'room|furniture|chair');a('Casas e interiores',2,'table|lamp');
          a('Documentos',5,'document|receipt');a('Documentos',4,'paper|handwriting');a('Documentos',3,'text|writing|paper product|page');a('Documentos',2,'font|number');
          a('Livros',5,'book');a('Livros',4,'publication|bookcase');a('Livros',3,'library');
          a('Eletrônicos',4,'mobile phone|phone|computer|laptop|personal computer');a('Eletrônicos',3,'gadget|electronic device|monitor|television|keyboard|communication device|camera');a('Eletrônicos',2,'screen|display device|technology');
          a('Roupas e moda',5,'shoe|footwear|sneakers');a('Roupas e moda',4,'clothing|dress|jeans|jacket|shirt|t-shirt|outerwear|handbag|jewellery');a('Roupas e moda',3,'fashion|sleeve|hat|bag|sunglasses|fashion accessory');
          a('Futebol',5,'soccer');a('Basquete',5,'basketball');a('Tênis',5,'tennis');
          a('Academia',5,'gym|weight training');a('Academia',4,'exercise|physical fitness');
          a('Esportes',4,'sport|ball|football|ball game|team sport|surfing|skateboard');a('Esportes',3,'sports equipment|player');
          a('Arte e desenhos',5,'cartoon|anime');a('Arte e desenhos',4,'painting|drawing|illustration|animation|sketch');a('Arte e desenhos',3,'art|visual arts|fictional character');
          a('Música e shows',5,'concert|guitar');a('Música e shows',4,'musical instrument|singer');a('Música e shows',3,'music|stage|performance');
          })();
          var IAALB=[];for(var kk in CAT)if(IAALB.indexOf(CAT[kk][0])<0)IAALB.push(CAT[kk][0]);
          function catAlbum(rs){var sc={},best='',bs=0;(rs||[]).forEach(function(l,p){var c=CAT[String(l).toLowerCase()];if(!c)return;sc[c[0]]=(sc[c[0]]||0)+c[1]*(6-p)});for(var n in sc)if(sc[n]>bs){bs=sc[n];best=n}return bs>=8?best:''}
          function album(x){var b=baseAlbum(x);if(x.v||!GEN.test(b))return b;return catAlbum(ROTULOS[x.u||x.p])||b}
          function groups(){var g={};items.forEach(function(i){if(i.bad)return;(g[i.a]=g[i.a]||[]).push(i)});return g}
          function home(){TQ.length=0;cur=null;selMode=false;var g=groups(),ns=Object.keys(g).sort(function(a,b){if(a==='Prints · Conversas')return -1;if(b==='Prints · Conversas')return 1;return g[b].length-g[a].length});var total=0;ns.forEach(function(n){total+=g[n].length});var hd=$('#hd');hd.innerHTML='';hd.appendChild(el('h1',0,'Galeria'));hd.appendChild(el('p','sub',total?items.filter(function(i){return !i.v}).length+' fotos'+(items.some(function(i){return i.v})?' · '+items.filter(function(i){return i.v}).length+' vídeos':'')+' em '+ns.length+' álbuns':'Separe suas fotos em álbuns automaticamente'));var row=el('div','row');var b1=el('button','pri',total?'Atualizar':'Ler minha galeria');b1.onclick=function(){ler()};row.appendChild(b1);if(total){var b2=el('button','sec','Organizar com IA');b2.onclick=analisar;row.appendChild(b2)}hd.appendChild(row);var app=$('#app');app.innerHTML='';var secs=[{t:'IA',f:function(n){return IAALB.indexOf(n)>=0}},{t:'Vídeos',f:function(n){return n==='Vídeos'}},{t:'Prints',f:function(n){return n.indexOf('Prints')===0}},{t:'Pastas do celular',f:function(){return true}}];var used={};secs.forEach(function(s){var list=ns.filter(function(n){return !used[n]&&s.f(n)});if(!list.length)return;list.forEach(function(n){used[n]=1});app.appendChild(el('div','sh',s.t));var grid=el('div','albums');list.forEach(function(n){var c=el('button','card'),im=el('img'),t=el('div','t');capa(g[n],im,0,0);t.appendChild(el('b',0,n));t.appendChild(el('span',0,g[n].length+(n==='Vídeos'?' vídeos':' fotos')));c.appendChild(im);c.appendChild(t);c.onclick=function(){lim=600;abrir(n)};grid.appendChild(c)});app.appendChild(grid)});}
          function nsel(list){var c=0;list.forEach(function(i){if(i.s)c++});return c}
          function pinta(i){if(i.el)i.el.classList.toggle('on',!!i.s)}
          function barra(n,list){var hd=$('#hd');hd.innerHTML='';var bar=el('div','bar');if(!selMode){var bk=el('button','back','‹ Voltar');bk.onclick=home;var bs=el('button','back','Selecionar');bs.onclick=function(){selMode=true;barra(n,list)};bar.appendChild(bk);bar.appendChild(el('h2',0,n+' ('+list.length+')'));bar.appendChild(bs)}else{var c=nsel(list),bc=el('button','back','Cancelar');bc.onclick=function(){list.forEach(function(i){i.s=false;pinta(i)});selMode=false;barra(n,list)};var bt=el('button','back','Tudo');bt.onclick=function(){list.forEach(function(i){i.s=true;pinta(i)});barra(n,list)};var bd=el('button','back dang','Excluir');bd.disabled=!c;bd.onclick=function(){apagar(list.filter(function(i){return i.s}))};bar.appendChild(bc);bar.appendChild(el('h2',0,c+' selecionadas'));bar.appendChild(bt);bar.appendChild(bd)}hd.appendChild(bar)}
          function abrir(n,keep){TQ.length=0;cur=n;var list=groups()[n]||[];if(!keep){selMode=false;list.forEach(function(i){i.s=false})}barra(n,list);var app=$('#app');app.innerHTML='';var grid=el('div','grid');list.slice(0,lim).forEach(function(i,idx){var im=el('img');i.el=im;pinta(i);load(i,im,function(){im.style.display='none'});var t;im.ontouchstart=function(){lp=false;t=setTimeout(function(){lp=true;selMode=true;i.s=true;pinta(i);barra(n,list)},450)};im.ontouchend=im.ontouchmove=im.ontouchcancel=function(){clearTimeout(t)};im.onclick=function(){if(lp){lp=false;return}if(selMode){i.s=!i.s;pinta(i);barra(n,list)}else mostrar(list,idx)};grid.appendChild(i.v?wrapV(im,i):im)});app.appendChild(grid);if(list.length>lim){var mb=el('button','mais','Mostrar mais');mb.onclick=function(){lim+=600;abrir(n,true)};app.appendChild(mb)}window.scrollTo(0,0)}
          function mostrar(list,idx){vlist=list;vi=idx;showV();$('#vw').style.display='flex';document.body.classList.add('viewer-open')}
          function showV(){var i=vlist[vi],im=$('#vim');$('#vp').style.display=i.v?'block':'none';$('#vc').textContent=(vi+1)+' / '+vlist.length;if(i.v){im.style.opacity='1';im.onload=null;im.onerror=null;thumbV(i,im,function(){});return}var c=cand(i),k=0;im.style.opacity='0';im.onerror=function(){k++;if(k<c.length)im.src=c[k];else im.style.opacity='1'};im.onload=function(){im.style.opacity='1'};im.src=c[0];var next=vlist[vi+1],prev=vlist[vi-1];if(next&&!next.v)new Image().src=cand(next)[0];if(prev&&!prev.v)new Image().src=cand(prev)[0]}
          $('#vp').onclick=function(){var i=vlist[vi];if(!Galeria||!i||!i.v)return;Galeria.abrirExterno({uri:i.u,tipo:'video/*'}).catch(function(e){alert('Não foi possível abrir o vídeo: '+(e.message||e))})};
          function nav(d){var k=vi+d;if(k<0||k>=vlist.length)return;vi=k;showV()}
          $('#vw').ontouchstart=function(e){tx=e.touches[0].clientX;swipeY=e.touches[0].clientY};$('#vw').ontouchend=function(e){var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-swipeY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.25)nav(dx<0?1:-1)};
          $('#vx').onclick=function(){$('#vw').style.display='none';document.body.classList.remove('viewer-open')};$('#vd').onclick=async function(){var ok=await apagar([vlist[vi]]);if(ok){vlist.splice(vi,1);if(!vlist.length){$('#vw').style.display='none';document.body.classList.remove('viewer-open');home()}else{if(vi>=vlist.length)vi=vlist.length-1;showV()}}};
