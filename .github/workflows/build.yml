          cat > GaleriaPlugin.java <<'FILE_GaleriaPlugin_java'
          package com.tobias.galeria;

          import android.Manifest;
          import android.content.ContentResolver;
          import android.content.ContentUris;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.MediaStore;
          import android.database.Cursor;

          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          import androidx.activity.result.ActivityResult;

          import com.google.android.gms.tasks.Tasks;
          import com.google.mlkit.vision.common.InputImage;
          import com.google.mlkit.vision.label.ImageLabel;
          import com.google.mlkit.vision.label.ImageLabeler;
          import com.google.mlkit.vision.label.ImageLabeling;
          import com.google.mlkit.vision.label.defaults.ImageLabelerOptions;

          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.IOException;
          import java.util.concurrent.Callable;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.Future;
          import java.util.ArrayList;
          import java.util.Collection;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;

          @CapacitorPlugin(name = "Galeria", permissions = {
            @Permission(alias = "fotos", strings = { Manifest.permission.READ_MEDIA_IMAGES, Manifest.permission.READ_MEDIA_VIDEO }),
            @Permission(alias = "fotosAntigo", strings = { Manifest.permission.READ_EXTERNAL_STORAGE, Manifest.permission.WRITE_EXTERNAL_STORAGE })
          })
          public class GaleriaPlugin extends Plugin {

            private final ExecutorService pool = Executors.newFixedThreadPool(3);
            private ImageLabeler labeler;

            private synchronized ImageLabeler rotulador() {
              if (labeler == null) {
                labeler = ImageLabeling.getClient(new ImageLabelerOptions.Builder().setConfidenceThreshold(0.5f).build());
              }
              return labeler;
            }

            private Uri videosUri() {
              if (Build.VERSION.SDK_INT >= 29) {
                return MediaStore.Video.Media.getContentUri(MediaStore.VOLUME_EXTERNAL);
              }
              return MediaStore.Video.Media.EXTERNAL_CONTENT_URI;
            }

            private String alias() {
              return Build.VERSION.SDK_INT >= 33 ? "fotos" : "fotosAntigo";
            }

            private Uri imagensUri() {
              if (Build.VERSION.SDK_INT >= 29) {
                return MediaStore.Images.Media.getContentUri(MediaStore.VOLUME_EXTERNAL);
              }
              return MediaStore.Images.Media.EXTERNAL_CONTENT_URI;
            }

            @PluginMethod
            public void estado(PluginCall call) {
              JSObject r = new JSObject();
              r.put("sdk", Build.VERSION.SDK_INT);
              r.put("permissao", getPermissionState(alias()).toString());
              call.resolve(r);
            }

            @PluginMethod
            public void listar(PluginCall call) {
              if (getPermissionState(alias()) != PermissionState.GRANTED) {
                requestPermissionForAlias(alias(), call, "depoisPermissao");
                return;
              }
              ler(call);
            }

            @PermissionCallback
            private void depoisPermissao(PluginCall call) {
              if (getPermissionState(alias()) == PermissionState.GRANTED) {
                ler(call);
              } else {
                call.reject("Permissão de fotos negada. Para ver a galeria inteira, permita acesso a todas as fotos em Configurações > Apps > Organizador de Galeria > Permissões.");
              }
            }

            private int lerColecao(Uri base, boolean video, JSArray arr, int[] ocultas) {
              ArrayList<String> cl = new ArrayList<>();
              cl.add(MediaStore.MediaColumns._ID);
              cl.add(MediaStore.MediaColumns.DATA);
              cl.add(MediaStore.MediaColumns.DISPLAY_NAME);
              cl.add(MediaStore.MediaColumns.WIDTH);
              cl.add(MediaStore.MediaColumns.HEIGHT);
              cl.add(MediaStore.MediaColumns.DATE_ADDED);
              if (Build.VERSION.SDK_INT >= 29) cl.add(MediaStore.MediaColumns.RELATIVE_PATH);
              if (video) cl.add(MediaStore.Video.Media.DURATION);
              String[] cols = cl.toArray(new String[0]);

              int total = 0;
              ContentResolver cr = getContext().getContentResolver();
              Cursor c = cr.query(base, cols, null, null, MediaStore.MediaColumns.DATE_ADDED + " DESC");
              if (c == null) return 0;
              try {
                int ci = c.getColumnIndex(MediaStore.MediaColumns._ID);
                int cd = c.getColumnIndex(MediaStore.MediaColumns.DATA);
                int cn = c.getColumnIndex(MediaStore.MediaColumns.DISPLAY_NAME);
                int crp = c.getColumnIndex(MediaStore.MediaColumns.RELATIVE_PATH);
                int cw = c.getColumnIndex(MediaStore.MediaColumns.WIDTH);
                int ch = c.getColumnIndex(MediaStore.MediaColumns.HEIGHT);
                int cdt = c.getColumnIndex(MediaStore.MediaColumns.DATE_ADDED);
                int cdu = video ? c.getColumnIndex(MediaStore.Video.Media.DURATION) : -1;
                while (c.moveToNext()) {
                  String p = cd >= 0 ? c.getString(cd) : "";
                  String nome = cn >= 0 ? c.getString(cn) : "";
                  String rel = crp >= 0 ? c.getString(crp) : "";
                  if (p == null) p = "";
                  if (p.contains("/.")) {
                    ocultas[0]++;
                    continue;
                  }
                  JSObject o = new JSObject();
                  o.put("path", p);
                  o.put("nome", nome == null ? "" : nome);
                  o.put("pasta", rel == null ? "" : rel);
                  o.put("uri", ContentUris.withAppendedId(base, c.getLong(ci)).toString());
                  o.put("w", cw >= 0 ? c.getInt(cw) : 0);
                  o.put("h", ch >= 0 ? c.getInt(ch) : 0);
                  o.put("tipo", video ? "video" : "foto");
                  o.put("data", cdt >= 0 ? c.getLong(cdt) : 0L);
                  o.put("dur", cdu >= 0 ? c.getLong(cdu) : 0L);
                  arr.put(o);
                  total++;
                }
              } finally {
                c.close();
              }
              return total;
            }

            private void ler(PluginCall call) {
              try {
                JSArray arr = new JSArray();
                int[] ocultas = new int[] { 0 };
                int nf = lerColecao(imagensUri(), false, arr, ocultas);
                int nv = 0;
                try {
                  nv = lerColecao(videosUri(), true, arr, ocultas);
                } catch (Exception e) {
                  // sem acesso a vídeos: segue só com as fotos
                }
                android.util.DisplayMetrics dm = new android.util.DisplayMetrics();
                getActivity().getWindowManager().getDefaultDisplay().getRealMetrics(dm);
                JSObject res = new JSObject();
                res.put("fotos", arr);
                res.put("nFotos", nf);
                res.put("nVideos", nv);
                res.put("ocultas", ocultas[0]);
                res.put("telaW", dm.widthPixels);
                res.put("telaH", dm.heightPixels);
                call.resolve(res);
              } catch (Exception e) {
                call.reject("Erro ao ler a galeria: " + e.getMessage());
              }
            }

            // Carrega uma versão pequena da imagem/vídeo (muito mais rápido que abrir a foto inteira).
            private Bitmap carregar(Uri u, int lado) {
              ContentResolver cr = getContext().getContentResolver();
              if (Build.VERSION.SDK_INT >= 29) {
                try {
                  return cr.loadThumbnail(u, new android.util.Size(lado, lado), null);
                } catch (Exception ignored) { }
              }
              try {
                BitmapFactory.Options o = new BitmapFactory.Options();
                o.inJustDecodeBounds = true;
                InputStream in = cr.openInputStream(u);
                if (in == null) return null;
                try { BitmapFactory.decodeStream(in, null, o); } finally { in.close(); }
                int s = 1;
                int m = Math.max(o.outWidth, o.outHeight);
                while (m / (s * 2) >= lado) s *= 2;
                BitmapFactory.Options o2 = new BitmapFactory.Options();
                o2.inSampleSize = s;
                InputStream in2 = cr.openInputStream(u);
                if (in2 == null) return null;
                try { return BitmapFactory.decodeStream(in2, null, o2); } finally { in2.close(); }
              } catch (Exception e) {
                return null;
              }
            }

            @PluginMethod
            public void miniatura(final PluginCall call) {
              final String s = call.getString("uri");
              if (s == null || s.isEmpty()) {
                call.reject("Sem endereço da mídia.");
                return;
              }
              pool.execute(new Runnable() {
                @Override
                public void run() {
                  try {
                    File dir = new File(getContext().getCacheDir(), "thumbs");
                    dir.mkdirs();
                    File f = new File(dir, "t" + Math.abs(s.hashCode()) + ".jpg");
                    if (!f.exists() || f.length() == 0) {
                      Bitmap b = carregar(Uri.parse(s), 360);
                      if (b == null) {
                        call.reject("Sem miniatura.");
                        return;
                      }
                      FileOutputStream out = new FileOutputStream(f);
                      try { b.compress(Bitmap.CompressFormat.JPEG, 82, out); } finally { out.close(); }
                      b.recycle();
                    }
                    JSObject r = new JSObject();
                    r.put("path", f.getAbsolutePath());
                    call.resolve(r);
                  } catch (Exception e) {
                    call.reject("Erro na miniatura: " + e.getMessage());
                  }
                }
              });
            }

            @PluginMethod
            public void abrirExterno(PluginCall call) {
              String s = call.getString("uri");
              String tipo = call.getString("tipo", "video/*");
              if (s == null || s.isEmpty()) {
                call.reject("Sem endereço da mídia.");
                return;
              }
              try {
                android.content.Intent i = new android.content.Intent(android.content.Intent.ACTION_VIEW);
                i.setDataAndType(Uri.parse(s), tipo);
                i.addFlags(android.content.Intent.FLAG_GRANT_READ_URI_PERMISSION);
                getActivity().startActivity(i);
                call.resolve();
              } catch (Exception e) {
                call.reject("Nenhum app encontrado para abrir.");
              }
            }

            @PluginMethod
            public void analisarLote(final PluginCall call) {
              final ArrayList<String> lista = new ArrayList<>();
              try {
                JSArray uris = call.getArray("uris");
                if (uris != null) {
                  for (int i = 0; i < uris.length(); i++) lista.add(uris.getString(i));
                }
              } catch (Exception e) {
                call.reject("Lote inválido: " + e.getMessage());
                return;
              }
              if (lista.isEmpty()) {
                JSObject r = new JSObject();
                r.put("resultados", new JSArray());
                call.resolve(r);
                return;
              }

              new Thread(new Runnable() {
                @Override
                public void run() {
                  try {
                    ArrayList<Future<JSArray>> futuros = new ArrayList<>();
                    for (final String s : lista) {
                      futuros.add(pool.submit(new Callable<JSArray>() {
                        @Override
                        public JSArray call() {
                          JSArray rotulos = new JSArray();
                          Bitmap b = null;
                          try {
                            b = carregar(Uri.parse(s), 320);
                            if (b != null) {
                              InputImage image = InputImage.fromBitmap(b, 0);
                              List<ImageLabel> labels = Tasks.await(rotulador().process(image));
                              int n = 0;
                              for (ImageLabel label : labels) {
                                if (n++ >= 6) break;
                                rotulos.put(label.getText());
                              }
                            }
                          } catch (Exception ignored) {
                            // Uma foto que não possa ser lida não interrompe o lote.
                          } finally {
                            if (b != null) b.recycle();
                          }
                          return rotulos;
                        }
                      }));
                    }
                    JSArray resultados = new JSArray();
                    for (int i = 0; i < lista.size(); i++) {
                      JSObject item = new JSObject();
                      item.put("uri", lista.get(i));
                      item.put("rotulos", futuros.get(i).get());
                      resultados.put(item);
                    }
                    JSObject out = new JSObject();
                    out.put("resultados", resultados);
                    call.resolve(out);
                  } catch (Exception e) {
                    call.reject("Erro na análise das imagens: " + e.getMessage());
                  }
                }
              }).start();
            }

            @PluginMethod
            public void apagar(PluginCall call) {
              try {
                JSArray arr = call.getArray("uris");
                boolean permanente = Boolean.TRUE.equals(call.getBoolean("permanente", false));
                if (arr == null || arr.length() == 0) {
                  call.reject("Nenhuma foto foi selecionada.");
                  return;
                }
                if (arr.length() > 2000) {
                  call.reject("O Android limita uma solicitação a 2000 fotos por vez.");
                  return;
                }

                ArrayList<Uri> uris = new ArrayList<>();
                for (int i = 0; i < arr.length(); i++) uris.add(Uri.parse(arr.getString(i)));

                if (Build.VERSION.SDK_INT >= 30) {
                  android.app.PendingIntent request = permanente
                    ? MediaStore.createDeleteRequest(getContext().getContentResolver(), uris)
                    : MediaStore.createTrashRequest(getContext().getContentResolver(), uris, true);
                  android.content.Intent intent = new android.content.Intent(getContext(), ConfirmMediaActivity.class);
                  intent.putExtra(ConfirmMediaActivity.EXTRA_PENDING_INTENT, request);
                  startActivityForResult(call, intent, "apagarResultado");
                } else {
                  if (getPermissionState(alias()) != PermissionState.GRANTED) {
                    requestPermissionForAlias(alias(), call, "depoisPermissaoApagar");
                    return;
                  }
                  int ok = 0;
                  for (Uri u : uris) if (getContext().getContentResolver().delete(u, null, null) > 0) ok++;
                  JSObject r = new JSObject();
                  r.put("ok", ok);
                  r.put("falha", uris.size() - ok);
                  call.resolve(r);
                }
              } catch (Exception e) {
                call.reject("Erro ao excluir: " + e.getMessage());
              }
            }

            @ActivityCallback
            private void apagarResultado(PluginCall call, ActivityResult result) {
              JSObject r = new JSObject();
              if (result.getResultCode() == android.app.Activity.RESULT_OK) {
                r.put("ok", call.getArray("uris").length());
                r.put("falha", 0);
                r.put("cancelado", false);
              } else {
                r.put("ok", 0);
                r.put("falha", 0);
                r.put("cancelado", true);
              }
              call.resolve(r);
            }

            @PermissionCallback
            private void depoisPermissaoApagar(PluginCall call) {
              if (getPermissionState(alias()) == PermissionState.GRANTED) apagar(call);
              else call.reject("Permissão de armazenamento negada.");
            }
          }
