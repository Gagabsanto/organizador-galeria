name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Criar arquivos do app v7
        shell: bash
        run: |
          set -e
          mkdir -p www
          cat > www/index.html <<'FILE_index_html'
          <!doctype html>
          <html lang="pt-BR"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <link rel="stylesheet" href="style.css">
          </head><body>
          <div id="hd"><h1>Galeria</h1><p class="sub">Carregando…</p></div>
          <p id="m"></p><div id="pb"><i></i></div><div id="app"></div><p id="dx"></p>
          <div id="vw"><div id="vt"><button id="vx">✕</button><span id="vc"></span><button id="vd">🗑</button></div><img id="vim" alt=""></div>
          <script src="app.js"></script>
          </body></html>
          FILE_index_html
          cat > www/style.css <<'FILE_style_css'
          *{box-sizing:border-box}
          :root{color-scheme:dark}
          body{margin:0;font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1014;color:#edf3f6;padding:calc(env(safe-area-inset-top,0px) + 14px) 12px 44px}
          body.viewer-open{overflow:hidden}
          h1{font-size:1.55rem;margin:0;font-weight:800}.sub{color:#91a3ae;margin:3px 0 12px;font-size:.9rem}
          .row{display:flex;gap:8px;margin-bottom:10px}.row button{min-width:0}
          button{font:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}.pri,.sec{flex:1;border-radius:14px;padding:12px 10px;font-weight:800;font-size:.94rem}.pri{background:#3cc4b4;color:#06201d}.sec{background:#19262d;color:#edf3f6}button:disabled{opacity:.42}
          #m{color:#f2c46d;margin:7px 0;min-height:1.1em;font-size:.88rem}.sh{margin:21px 2px 8px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#8296a2;font-weight:800}
          #pb{display:none;height:5px;background:#18242a;border-radius:8px;overflow:hidden;margin:4px 0 9px}#pb i{display:block;height:100%;width:0;background:#3cc4b4;transition:width .12s linear}
          #dx{color:#52646f;font-size:.7rem;margin-top:25px}.albums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{position:relative;aspect-ratio:1;border-radius:15px;overflow:hidden;background:#141d23;padding:0;color:#fff;text-align:left;box-shadow:0 4px 16px rgba(0,0,0,.18)}.card img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}.card .t{position:absolute;left:0;right:0;bottom:0;padding:28px 8px 8px;background:linear-gradient(transparent,rgba(0,0,0,.86));display:flex;flex-direction:column}.card .t b{font-size:.77rem;line-height:1.16;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.card .t span{font-size:.68rem;color:#c4d1d8;margin-top:2px}
          .bar{display:flex;align-items:center;gap:7px;margin-bottom:12px}.back{background:#19262d;color:#edf3f6;border-radius:12px;padding:10px 11px;font-weight:800;white-space:nowrap}.bar h2{font-size:1rem;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.grid img{width:100%;aspect-ratio:1;object-fit:cover;background:#141d23;transition:opacity .15s,outline .12s}.grid img.on{outline:4px solid #3cc4b4;outline-offset:-4px;opacity:.58}.mais{width:100%;margin-top:12px;padding:13px;border-radius:13px;background:#19262d;color:#edf3f6;font-weight:700}
          #vw{position:fixed;left:0;top:0;right:0;bottom:0;background:#000;display:none;align-items:center;justify-content:center;z-index:99;touch-action:none}#vw img{max-width:100%;max-height:100%;object-fit:contain;transition:opacity .12s}.dang{background:#68232b!important;color:#ffdce0!important}
          #vt{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;background:linear-gradient(rgba(0,0,0,.75),transparent);z-index:2}#vt button{background:rgba(25,25,25,.65);color:#fff;border-radius:22px;padding:9px 14px;font-size:1rem;backdrop-filter:blur(5px)}#vc{color:#fff;font-size:.88rem;font-weight:700;text-shadow:0 1px 4px #000}
          @media(max-width:370px){.albums{gap:5px}.card{border-radius:11px}.back{padding:9px 8px;font-size:.88rem}}
          FILE_style_css
          cat > www/app.js <<'FILE_app_js'
          var VER='v7',items=[],lim=600,tela=null,cur=null,selMode=false,SDK=0,lp=false,vlist=[],vi=0,tx=0,swipeY=0;
          var Galeria=(window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Galeria)||null;
          var PS={},VISTOS={},ROTULOS={};
          try{PS=JSON.parse(localStorage.getItem('praia')||'{}');VISTOS=JSON.parse(localStorage.getItem('vistos')||'{}');ROTULOS=JSON.parse(localStorage.getItem('rotulos')||'{}')}catch(e){}
          function salvar(){try{localStorage.setItem('praia',JSON.stringify(PS));localStorage.setItem('vistos',JSON.stringify(VISTOS));localStorage.setItem('rotulos',JSON.stringify(ROTULOS))}catch(e){}}
          window.onerror=function(m){var e=document.querySelector('#m');if(e)e.textContent='Erro no app: '+m};
          function $(s){return document.querySelector(s)}
          function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
          function setm(t){$('#m').textContent=t}
          function cand(i){var a=[];if(i.u)a.push(i.u.indexOf('content://')===0?i.u:Capacitor.convertFileSrc(i.u));a.push(Capacitor.convertFileSrc(encodeURI(i.p).replace(/#/g,'%23').replace(/\?/g,'%3F')));a.push(Capacitor.convertFileSrc(i.p));return a}
          function load(i,im,done){var c=cand(i),k=0;im.loading='lazy';im.alt='';im.onerror=function(){k++;if(k<c.length)im.src=c[k];else{i.bad=true;im.onerror=null;if(done)done()}};im.src=c[0]}
          function capa(list,im,from,n){while(from<list.length&&list[from].bad)from++;if(from>=list.length||n>6){im.style.display='none';return}load(list[from],im,function(){capa(list,im,from+1,n+1)})}
          function ehPrint(w,h){if(!tela||!w||!h)return false;var a=Math.max(w,h),b=Math.min(w,h),A=Math.max(tela.w,tela.h),B=Math.min(tela.w,tela.h);if(a===A&&b===B)return true;return Math.abs(a/b-A/B)<0.012&&a<=A*1.02&&a>=A*0.5}
          var CONV=/whatsapp|telegram|messenger|signal|discord|mensagens|messages|sms|chat|conversa/i;
          function baseAlbum(x){var p=x.p||'',f=x.nome||p.split('/').pop(),rel=x.pasta||'',parts=p?p.split('/'):[],d=rel?rel.replace(/\\/g,'/').split('/').filter(Boolean).pop():(parts[parts.length-2]||'Outros');if(PS[p])return 'Praia';if(/^(sent|private)$/i.test(d))d=(parts[parts.length-3]||'Outros')+' · enviadas';if(/screenshot|captura/i.test(f)||/screenshots/i.test(p)){var m=f.match(/screenshot[_ -]?\d{8}[-_ ]?\d{4,6}[_ -](.+)\.\w+$/i);var app=m?m[1].replace(/[_-]+/g,' ').trim():'';if(CONV.test(app))return 'Prints · Conversas';return app?'Prints · '+app:'Prints'}if(ehPrint(x.w,x.h))return 'Prints recebidos';return d}
          function labelAlbum(label){var s=(label||'').toLowerCase().trim();var map={beach:'Praia',seashore:'Praia',coast:'Praia',ocean:'Mar',sea:'Mar',food:'Comida',dish:'Comida',meal:'Comida',pizza:'Comida',hamburger:'Comida',cake:'Comida',dessert:'Comida',fruit:'Comida',animal:'Animais',dog:'Cachorros',cat:'Gatos',bird:'Aves',horse:'Cavalos',car:'Carros',vehicle:'Carros',motorcycle:'Motos',bicycle:'Bicicletas',person:'Pessoas',people:'Pessoas',human:'Pessoas',selfie:'Selfies',portrait:'Pessoas',mountain:'Montanhas',landscape:'Natureza',nature:'Natureza',forest:'Natureza',flower:'Flores',plant:'Plantas',tree:'Natureza',sky:'Céu',sunset:'Pôr do sol',sunrise:'Nascer do sol',building:'Prédios',house:'Casas',city:'Cidade',cityscape:'Cidade',phone:'Celular',computer:'Computador',laptop:'Computador',screen:'Tela',text:'Texto',book:'Livros',document:'Documentos',clothing:'Roupas',shoe:'Calçados',sport:'Esportes',football:'Esportes',soccer:'Futebol',basketball:'Basquete',beverage:'Bebidas',drink:'Bebidas',coffee:'Café',cake:'Comida'};if(map[s])return map[s];return ''}
          function album(x){var b=baseAlbum(x);if(b!=='Outros'&&b!=='Camera'&&b!=='WhatsApp')return b;var rs=ROTULOS[x.u||x.p]||[];for(var i=0;i<rs.length;i++){var a=labelAlbum(rs[i]);if(a)return a}return b}
          function groups(){var g={};items.forEach(function(i){if(i.bad)return;(g[i.a]=g[i.a]||[]).push(i)});return g}
          function home(){cur=null;selMode=false;var g=groups(),ns=Object.keys(g).sort(function(a,b){if(a==='Prints · Conversas')return -1;if(b==='Prints · Conversas')return 1;return g[b].length-g[a].length});var total=0;ns.forEach(function(n){total+=g[n].length});var hd=$('#hd');hd.innerHTML='';hd.appendChild(el('h1',0,'Galeria'));hd.appendChild(el('p','sub',total?total+' fotos em '+ns.length+' álbuns':'Separe suas fotos em álbuns automaticamente'));var row=el('div','row');var b1=el('button','pri',total?'Atualizar':'Ler minha galeria');b1.onclick=function(){ler()};row.appendChild(b1);if(total){var b2=el('button','sec','Organizar com IA');b2.onclick=analisar;row.appendChild(b2)}hd.appendChild(row);var app=$('#app');app.innerHTML='';var secs=[{t:'IA',f:function(n){return ['Praia','Mar','Comida','Animais','Cachorros','Gatos','Aves','Cavalos','Carros','Motos','Bicicletas','Pessoas','Selfies','Montanhas','Natureza','Flores','Plantas','Céu','Pôr do sol','Nascer do sol','Prédios','Casas','Cidade','Celular','Computador','Tela','Texto','Livros','Documentos','Roupas','Calçados','Esportes','Futebol','Basquete','Bebidas','Café'].indexOf(n)>=0}},{t:'Prints',f:function(n){return n.indexOf('Prints')===0}},{t:'Pastas do celular',f:function(){return true}}];var used={};secs.forEach(function(s){var list=ns.filter(function(n){return !used[n]&&s.f(n)});if(!list.length)return;list.forEach(function(n){used[n]=1});app.appendChild(el('div','sh',s.t));var grid=el('div','albums');list.forEach(function(n){var c=el('button','card'),im=el('img'),t=el('div','t');capa(g[n],im,0,0);t.appendChild(el('b',0,n));t.appendChild(el('span',0,g[n].length+' fotos'));c.appendChild(im);c.appendChild(t);c.onclick=function(){lim=600;abrir(n)};grid.appendChild(c)});app.appendChild(grid)});}
          function nsel(list){var c=0;list.forEach(function(i){if(i.s)c++});return c}
          function pinta(i){if(i.el)i.el.classList.toggle('on',!!i.s)}
          function barra(n,list){var hd=$('#hd');hd.innerHTML='';var bar=el('div','bar');if(!selMode){var bk=el('button','back','‹ Voltar');bk.onclick=home;var bs=el('button','back','Selecionar');bs.onclick=function(){selMode=true;barra(n,list)};bar.appendChild(bk);bar.appendChild(el('h2',0,n+' ('+list.length+')'));bar.appendChild(bs)}else{var c=nsel(list),bc=el('button','back','Cancelar');bc.onclick=function(){list.forEach(function(i){i.s=false;pinta(i)});selMode=false;barra(n,list)};var bt=el('button','back','Tudo');bt.onclick=function(){list.forEach(function(i){i.s=true;pinta(i)});barra(n,list)};var bd=el('button','back dang','Excluir');bd.disabled=!c;bd.onclick=function(){apagar(list.filter(function(i){return i.s}))};bar.appendChild(bc);bar.appendChild(el('h2',0,c+' selecionadas'));bar.appendChild(bt);bar.appendChild(bd)}hd.appendChild(bar)}
          function abrir(n,keep){cur=n;var list=groups()[n]||[];if(!keep){selMode=false;list.forEach(function(i){i.s=false})}barra(n,list);var app=$('#app');app.innerHTML='';var grid=el('div','grid');list.slice(0,lim).forEach(function(i,idx){var im=el('img');i.el=im;pinta(i);load(i,im,function(){im.style.display='none'});var t;im.ontouchstart=function(){lp=false;t=setTimeout(function(){lp=true;selMode=true;i.s=true;pinta(i);barra(n,list)},450)};im.ontouchend=im.ontouchmove=im.ontouchcancel=function(){clearTimeout(t)};im.onclick=function(){if(lp){lp=false;return}if(selMode){i.s=!i.s;pinta(i);barra(n,list)}else mostrar(list,idx)};grid.appendChild(im)});app.appendChild(grid);if(list.length>lim){var mb=el('button','mais','Mostrar mais');mb.onclick=function(){lim+=600;abrir(n,true)};app.appendChild(mb)}window.scrollTo(0,0)}
          function mostrar(list,idx){vlist=list;vi=idx;showV();$('#vw').style.display='flex';document.body.classList.add('viewer-open')}
          function showV(){var i=vlist[vi],im=$('#vim'),c=cand(i),k=0;im.style.opacity='0';im.onerror=function(){k++;if(k<c.length)im.src=c[k];else im.style.opacity='1'};im.onload=function(){im.style.opacity='1'};im.src=c[0];$('#vc').textContent=(vi+1)+' / '+vlist.length;var next=vlist[vi+1],prev=vlist[vi-1];if(next)new Image().src=cand(next)[0];if(prev)new Image().src=cand(prev)[0]}
          function nav(d){var k=vi+d;if(k<0||k>=vlist.length)return;vi=k;showV()}
          $('#vw').ontouchstart=function(e){tx=e.touches[0].clientX;swipeY=e.touches[0].clientY};$('#vw').ontouchend=function(e){var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-swipeY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.25)nav(dx<0?1:-1)};
          $('#vx').onclick=function(){$('#vw').style.display='none';document.body.classList.remove('viewer-open')};$('#vd').onclick=async function(){var ok=await apagar([vlist[vi]]);if(ok){vlist.splice(vi,1);if(!vlist.length){$('#vw').style.display='none';document.body.classList.remove('viewer-open');home()}else{if(vi>=vlist.length)vi=vlist.length-1;showV()}}};
          async function apagar(arr){if(!arr.length)return false;if(!Galeria){setm('Módulo da galeria indisponível.');return false}if(arr.length>2000){setm('Selecione no máximo 2000 fotos por vez.');return false}if(!confirm('Mover '+arr.length+' foto(s) para a lixeira do Android?'))return false;setm('Aguardando confirmação do Android…');try{var r=await Galeria.apagar({uris:arr.map(function(i){return i.u}),permanente:false});if(r.cancelado){setm('Exclusão cancelada.');return false}setm(r.ok+' foto(s) enviadas para a lixeira.');var rm={};arr.forEach(function(i){rm[i.u||i.p]=1});items=items.filter(function(i){return !rm[i.u||i.p]});selMode=false;salvar();if(cur&&groups()[cur])abrir(cur);else home();return r.ok>0}catch(e){setm('Não foi possível excluir: '+(e.message||e));return false}}
          async function diag(){if(!Galeria){$('#dx').textContent=VER+' · módulo Galeria não encontrado no app';return}try{var r=await Galeria.estado();SDK=r.sdk;$('#dx').textContent=VER+' · Android API '+r.sdk+' · permissão: '+r.permissao}catch(e){$('#dx').textContent=VER+' · diagnóstico indisponível: '+(e.message||e)}}
          async function ler(voltar,quieto){if(!Galeria){setm('O módulo da galeria não foi carregado no app.');return}if(!quieto)setm('Lendo todas as fotos da galeria…');try{var r=await Galeria.listar();tela={w:r.telaW,h:r.telaH};items=r.fotos.map(function(x){var o={p:x.path,u:x.uri,w:x.w,h:x.h};o.a=album(o);return o});if(!quieto)setm(items.length?items.length+' fotos encontradas.':'Nenhuma foto encontrada.');if(voltar&&groups()[voltar])abrir(voltar);else home()}catch(e){setm('Não foi possível ler: '+(e.message||e))}diag()}
          async function analisar(){if(!Galeria||!items.length)return;var list=items.filter(function(i){return !i.bad&&!VISTOS[i.u||i.p]});if(!list.length){setm('A IA já analisou todas as fotos disponíveis.');return}var pb=$('#pb');pb.style.display='block';var batch=10,feitas=0;for(var k=0;k<list.length;k+=batch){var part=list.slice(k,k+batch);setm('Analisando com IA… '+Math.min(k+part.length,list.length)+' de '+list.length);pb.firstChild.style.width=Math.round(Math.min(k+part.length,list.length)*100/list.length)+'%';try{var r=await Galeria.analisarLote({uris:part.map(function(i){return i.u})});(r.resultados||[]).forEach(function(x,j){var it=part[j];var key=it.u||it.p;ROTULOS[key]=x.rotulos||[];VISTOS[key]=1;it.a=album(it)});feitas+=part.length}catch(e){setm('Erro na IA: '+(e.message||e));break}salvar();await new Promise(function(resolve){setTimeout(resolve,0)})}pb.style.display='none';salvar();home();setm(feitas+' foto(s) analisadas.')}
          async function praia(){var list=items.filter(function(i){return !i.bad&&i.a.indexOf('Prints')!==0&&i.a!=='Praia'&&!VISTOS[i.p]});if(!list.length){setm('Nada novo para analisar.');return}var pb=$('#pb');pb.style.display='block';for(var k=0;k<list.length;k++){setm('Procurando praia… '+(k+1)+' de '+list.length);pb.firstChild.style.width=Math.round((k+1)*100/list.length)+'%';var im=await abrirImg(list[k]);if(!im)list[k].bad=true;else{VISTOS[list[k].p]=1;if(isBeach(im)){PS[list[k].p]=1;list[k].a='Praia'}}if(k%50===0){salvar();await new Promise(function(r){setTimeout(r,0)})}}salvar();pb.style.display='none';setm('');home()}
          function isBeach(img){var w=img.naturalWidth,h=img.naturalHeight;if(w&&h&&Math.max(w,h)/Math.min(w,h)>1.9)return false;var c=document.createElement('canvas');c.width=c.height=24;var x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,24,24);var d=x.getImageData(0,0,24,24).data,sky=0,sand=0,sea=0,n=0;for(var y=0;y<24;y++)for(var i=0;i<24;i++){var q=(y*24+i)*4,r=d[q],g=d[q+1],b=d[q+2];if(y<10){n++;if(b>r+20)sky++}else if(y>=14){if(r>150&&g>120&&r>b+30&&g>b+10)sand++;if(b>r+20)sea++}}return sky/n>0.4&&(sand/240>0.22||sea/240>0.35)}
          async function abrirImg(i){var c=cand(i);for(var k=0;k<c.length;k++){try{var im=new Image();im.src=c[k];await im.decode();return im}catch(e){}}return null}
          home();diag();
          FILE_app_js
          cat > GaleriaPlugin.java <<'FILE_GaleriaPlugin_java'
          package com.tobias.galeria;
          
          import android.Manifest;
          import android.content.ContentResolver;
          import android.content.ContentUris;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.MediaStore;
          import android.database.Cursor;
          
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;
          
          import androidx.activity.result.ActivityResult;
          
          import com.google.android.gms.tasks.Tasks;
          import com.google.mlkit.vision.common.InputImage;
          import com.google.mlkit.vision.label.ImageLabel;
          import com.google.mlkit.vision.label.ImageLabeler;
          import com.google.mlkit.vision.label.ImageLabeling;
          import com.google.mlkit.vision.label.defaults.ImageLabelerOptions;
          
          import java.io.IOException;
          import java.util.ArrayList;
          import java.util.Collection;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;
          
          @CapacitorPlugin(name = "Galeria", permissions = {
            @Permission(alias = "fotos", strings = { Manifest.permission.READ_MEDIA_IMAGES }),
            @Permission(alias = "fotosAntigo", strings = { Manifest.permission.READ_EXTERNAL_STORAGE, Manifest.permission.WRITE_EXTERNAL_STORAGE })
          })
          public class GaleriaPlugin extends Plugin {
          
            private String alias() {
              return Build.VERSION.SDK_INT >= 33 ? "fotos" : "fotosAntigo";
            }
          
            private Uri imagensUri() {
              if (Build.VERSION.SDK_INT >= 29) {
                return MediaStore.Images.Media.getContentUri(MediaStore.VOLUME_EXTERNAL);
              }
                              call.reject("Erro ao ler a galeria: " + e.getMessage());
              }
            }
          
            @PluginMethod
            public void analisarLote(final PluginCall call) {
              final JSArray uris;
              try {
                uris = call.getArray("uris");
                if (uris == null || uris.length() == 0) {
                  JSObject r = new JSObject();
                  r.put("resultados", new JSArray());
                  call.resolve(r);
                  return;
                }
              } catch (Exception e) {
                call.reject("Lote inválido: " + e.getMessage());
                return;
              }
          
              execute(new Runnable() {
                @Override
                public void run() {
                  ImageLabelerOptions options = new ImageLabelerOptions.Builder()
                    .setConfidenceThreshold(0.55f)
                    .setMaxResultCount(5)
                    .build();
                  ImageLabeler labeler = ImageLabeling.getClient(options);
                  JSArray resultados = new JSArray();
                  try {
                    for (int i = 0; i < uris.length(); i++) {
                      String s = uris.getString(i);
                      JSObject item = new JSObject();
                      JSArray rotulos = new JSArray();
                      try {
                        InputImage image = InputImage.fromFilePath(getContext(), Uri.parse(s));
                        List<ImageLabel> labels = Tasks.await(labeler.process(image));
                        for (ImageLabel label : labels) {
                          rotulos.put(label.getText());
                        }
                      } catch (Exception ignored) {
                        // Uma foto que não possa ser decodificada não interrompe o lote.
                      }
                      item.put("uri", s);
                      item.put("rotulos", rotulos);
                      resultados.put(item);
                    }
                    JSObject out = new JSObject();
                    out.put("resultados", resultados);
                    call.resolve(out);
                  } catch (Exception e) {
                    call.reject("Erro na análise das imagens: " + e.getMessage());
                  } finally {
                    labeler.close();
                  }
                }
              });
            }
          
            @PluginMethod
            public void apagar(PluginCall call) {
              try {
                JSArray arr = call.getArray("uris");
                boolean permanente = Boolean.TRUE.equals(call.getBoolean("permanente", false));
                if (arr == null || arr.length() == 0) {
                  call.reject("Nenhuma foto foi selecionada.");
                  return;
                }
                if (arr.length() > 2000) {
                  call.reject("O Android limita uma solicitação a 2000 fotos por vez.");
                  return;
                }
          
                ArrayList<Uri> uris = new ArrayList<>();
                for (int i = 0; i < arr.length(); i++) uris.add(Uri.parse(arr.getString(i)));
          
                if (Build.VERSION.SDK_INT >= 30) {
                  android.app.PendingIntent request = permanente
                    ? MediaStore.createDeleteRequest(getContext().getContentResolver(), uris)
                    : MediaStore.createTrashRequest(getContext().getContentResolver(), uris, true);
                  android.content.Intent intent = new android.content.Intent(getContext(), ConfirmMediaActivity.class);
                  intent.putExtra(ConfirmMediaActivity.EXTRA_PENDING_INTENT, request);
                  startActivityForResult(call, intent, "apagarResultado");
                } else {
                  if (getPermissionState(alias()) != PermissionState.GRANTED) {
                    requestPermissionForAlias(alias(), call, "depoisPermissaoApagar");
                    return;
                  }
                  int ok = 0;
                  for (Uri u : uris) if (getContext().getContentResolver().delete(u, null, null) > 0) ok++;
                  JSObject r = new JSObject();
                  r.put("ok", ok);
                  r.put("falha", uris.size() - ok);
                  call.resolve(r);
                }
              } catch (Exception e) {
                call.reject("Erro ao excluir: " + e.getMessage());
              }
            }
          
            @ActivityCallback
            private void apagarResultado(PluginCall call, ActivityResult result) {
              JSObject r = new JSObject();
              if (result.getResultCode() == android.app.Activity.RESULT_OK) {
                r.put("ok", call.getArray("uris").length());
                r.put("falha", 0);
                r.put("cancelado", false);
              } else {
                r.put("ok", 0);
                r.put("falha", 0);
                r.put("cancelado", true);
              }
              call.resolve(r);
            }
          
            @PermissionCallback
            private void depoisPermissaoApagar(PluginCall call) {
              if (getPermissionState(alias()) == PermissionState.GRANTED) apagar(call);
              else call.reject("Permissão de armazenamento negada.");
            }
          }
          FILE_GaleriaPlugin_java
          cat > ConfirmMediaActivity.java <<'FILE_ConfirmMediaActivity_java'
          package com.tobias.galeria;
          
          import android.app.Activity;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.os.Bundle;
          
          public class ConfirmMediaActivity extends Activity {
            public static final String EXTRA_PENDING_INTENT = "pendingIntent";
            private static final int REQUEST = 7401;
          
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              PendingIntent pending = getIntent().getParcelableExtra(EXTRA_PENDING_INTENT);
              if (pending == null) {
                setResult(RESULT_CANCELED);
                finish();
                return;
              }
              try {
                startIntentSenderForResult(pending.getIntentSender(), REQUEST, null, 0, 0, 0);
              } catch (Exception e) {
                setResult(RESULT_CANCELED);
                finish();
              }
            }
          
            @Override
            protected void onActivityResult(int requestCode, int resultCode, Intent data) {
              super.onActivityResult(requestCode, resultCode, data);
              if (requestCode == REQUEST) {
                setResult(resultCode, data);
                finish();
              }
            }
          }
          FILE_ConfirmMediaActivity_java
          cat > MainActivity.java <<'FILE_MainActivity_java'
          package com.tobias.galeria;
          
          import android.os.Bundle;
