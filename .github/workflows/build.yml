name: Gerar APK
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Criar o app
        run: |
          mkdir -p www
          cat > www/index.html <<'EOF'
          <!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <style>
          *{box-sizing:border-box}
          body{margin:0;font:16px system-ui,sans-serif;background:#0d1317;color:#eaf0f3;padding:calc(env(safe-area-inset-top,0px) + 16px) 14px 40px}
          h1{font-size:1.7rem;margin:0}
          .sub{color:#8fa1ad;margin:4px 0 14px}
          .row{display:flex;gap:8px;margin-bottom:12px}
          button{font:inherit;border:0;cursor:pointer}
          .pri,.sec{flex:1;border-radius:14px;padding:14px;font-weight:700}
          .pri{background:#3cc4b4;color:#06201d}
          .sec{background:#19262d;color:#eaf0f3}
          button:disabled{opacity:.45}
          #m{color:#f2c46d;margin:6px 0;min-height:1em}
          #dx{color:#5d6f7b;font-size:.75rem;margin-top:24px}
          .albums{display:grid;grid-template-columns:1fr 1fr;gap:12px}
          .card{background:#151e24;border-radius:16px;padding:8px;text-align:left;color:inherit;display:flex;flex-direction:column;gap:2px}
          .card img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:#0d1317;margin-bottom:6px}
          .card b{font-size:.95rem;padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          .card span{font-size:.8rem;color:#8fa1ad;padding:0 4px 4px}
          .bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
          .back{background:#19262d;color:#eaf0f3;border-radius:12px;padding:10px 14px;font-weight:700}
          .bar h2{font-size:1.1rem;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
          .grid img{width:100%;aspect-ratio:1;object-fit:cover;background:#151e24}
          .mais{width:100%;margin-top:12px;padding:12px;border-radius:12px;background:#19262d;color:#eaf0f3}
          #vw{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:9}
          #vw img{max-width:100%;max-height:100%}
          </style></head><body>
          <div id="hd"><h1>Galeria</h1><p class="sub">Carregando…</p></div><p id="m"></p><div id="app"></div><p id="dx"></p>
          <div id="vw"><img alt=""></div>
          <script>
          var items=[],beachDone=false,lim=900,VER='v4';
          var Galeria=(window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Galeria)||null;
          window.onerror=function(m){var e=document.querySelector('#m');if(e)e.textContent='Erro no app: '+m};
          function $(s){return document.querySelector(s)}
          function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
          function src(p){return Capacitor.convertFileSrc(p)}
          function setm(t){$('#m').textContent=t}
          function thumb(i,im){
            im.loading='lazy';im.alt='';
            im.onerror=function(){if(!im.dataset.f){im.dataset.f=1;im.src=src(i.p)}};
            im.src=src(i.u||i.p);
          }
          function album(p){
            var f=p.split('/').pop(),d=p.split('/').slice(-2,-1)[0]||'Outros';
            if(/screenshot|captura/i.test(f)||/screenshots/i.test(p)){
              var m=f.match(/screenshot[_ -]?\d{8}[-_ ]?\d{4,6}[_ -](.+)\.\w+$/i);
              return m?'Prints · '+m[1].replace(/[_-]+/g,' '):'Prints';
            }
            return d;
          }
          function groups(){var g={};items.forEach(function(i){(g[i.a]=g[i.a]||[]).push(i)});return g}
          function home(){
            var g=groups(),ns=Object.keys(g).sort(function(a,b){return g[b].length-g[a].length});
            var hd=$('#hd');hd.innerHTML='';
            hd.appendChild(el('h1',0,'Galeria'));
            hd.appendChild(el('p','sub',items.length?items.length+' fotos em '+ns.length+' álbuns':'Separe suas fotos em álbuns automaticamente'));
            var row=el('div','row');
            var b1=el('button','pri',items.length?'Atualizar galeria':'Ler minha galeria');b1.onclick=ler;row.appendChild(b1);
            if(items.length){var b2=el('button','sec',beachDone?'Praia detectada':'Detectar praia');b2.disabled=beachDone;b2.onclick=praia;row.appendChild(b2)}
            hd.appendChild(row);
            var app=$('#app');app.innerHTML='';
            var grid=el('div','albums');
            ns.forEach(function(n){
              var c=el('button','card'),im=el('img');thumb(g[n][0],im);
              c.appendChild(im);c.appendChild(el('b',0,n));c.appendChild(el('span',0,g[n].length+' fotos'));
              c.onclick=function(){lim=900;abrir(n)};grid.appendChild(c);
            });
            app.appendChild(grid);
          }
          function abrir(n){
            var list=groups()[n]||[];
            var hd=$('#hd');hd.innerHTML='';
            var bar=el('div','bar'),bk=el('button','back','‹ Voltar');bk.onclick=home;
            bar.appendChild(bk);bar.appendChild(el('h2',0,n+' ('+list.length+')'));hd.appendChild(bar);
            var app=$('#app');app.innerHTML='';
            var grid=el('div','grid');
            list.slice(0,lim).forEach(function(i){
              var im=el('img');thumb(i,im);
              im.onclick=function(){var v=$('#vw');v.firstChild.src=src(i.u||i.p);v.style.display='flex'};
              grid.appendChild(im);
            });
            app.appendChild(grid);
            if(list.length>lim){var mb=el('button','mais','Mostrar mais');mb.onclick=function(){lim+=900;abrir(n)};app.appendChild(mb)}
            window.scrollTo(0,0);
          }
          $('#vw').onclick=function(){this.style.display='none'};
          async function diag(){
            if(!Galeria){$('#dx').textContent=VER+' · modulo Galeria nao encontrado no app';return}
            try{var r=await Galeria.estado();$('#dx').textContent=VER+' · Android API '+r.sdk+' · permissão: '+r.permissao}
            catch(e){$('#dx').textContent=VER+' · diagnóstico indisponível: '+(e.message||e)}
          }
          async function ler(){
            if(!Galeria){setm('O módulo da galeria não foi carregado no app.');return}
            setm('Lendo a galeria…');
            try{
              var r=await Galeria.listar();
              items=r.fotos.map(function(x){return{p:x.path,u:x.uri,a:album(x.path)}});
              setm(items.length?'':'Nenhuma foto encontrada.');
              home();
            }catch(e){setm('Não foi possível ler: '+(e.message||e))}
            diag();
          }
          function isBeach(img){
            var c=document.createElement('canvas');c.width=c.height=24;
            var x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,24,24);
            var d=x.getImageData(0,0,24,24).data,sky=0,sand=0,sea=0,n=0;
            for(var y=0;y<24;y++)for(var i=0;i<24;i++){
              var k=(y*24+i)*4,r=d[k],g=d[k+1],b=d[k+2];
              if(y<10){n++;if(b>r+20)sky++}
              else if(y>=14){if(r>150&&g>120&&r>b+30&&g>b+10)sand++;if(b>r+20)sea++}
            }
            return sky/n>0.35&&(sand/240>0.2||sea/240>0.3);
          }
          async function praia(){
            var list=items.filter(function(i){return i.a.indexOf('Prints')!==0});
            for(var k=0;k<list.length;k++){
              setm('Procurando praia… '+(k+1)+' de '+list.length);
              try{
                var im=new Image();im.src=src(list[k].u||list[k].p);await im.decode();
                if(isBeach(im))list[k].a='Praia';
              }catch(e){}
              if(k%25===0)await new Promise(function(r){setTimeout(r)});
            }
            beachDone=true;setm('');home();
          }
          home();diag();
          </script></body></html>
          EOF
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "Organizador de Galeria" com.tobias.galeria --web-dir www
          npx cap add android
          D=android/app/src/main/java/com/tobias/galeria
          cat > $D/GaleriaPlugin.java <<'EOF'
          package com.tobias.galeria;
          import android.Manifest;
          import android.content.ContentUris;
          import android.database.Cursor;
          import android.provider.MediaStore;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;
          @CapacitorPlugin(name = "Galeria", permissions = {
            @Permission(alias = "fotos", strings = { Manifest.permission.READ_MEDIA_IMAGES }),
            @Permission(alias = "fotosAntigo", strings = { Manifest.permission.READ_EXTERNAL_STORAGE })
          })
          public class GaleriaPlugin extends Plugin {
            private String alias() { return android.os.Build.VERSION.SDK_INT >= 33 ? "fotos" : "fotosAntigo"; }
            @PluginMethod
            public void estado(PluginCall call) {
              JSObject r = new JSObject();
              r.put("sdk", android.os.Build.VERSION.SDK_INT);
              r.put("permissao", getPermissionState(alias()).toString());
              call.resolve(r);
            }
            @PluginMethod
            public void listar(PluginCall call) {
              if (getPermissionState(alias()) != PermissionState.GRANTED) {
                requestPermissionForAlias(alias(), call, "depoisPermissao");
                return;
              }
              ler(call);
            }
            @PermissionCallback
            private void depoisPermissao(PluginCall call) {
              if (getPermissionState(alias()) == PermissionState.GRANTED) ler(call);
              else call.reject("Permissão de fotos negada. Ative em Configurações > Apps > Organizador de Galeria > Permissões > Fotos e vídeos.");
            }
            private void ler(PluginCall call) {
              try {
                JSArray arr = new JSArray();
                String[] cols = { MediaStore.Images.Media._ID, MediaStore.Images.Media.DATA };
                Cursor c = getContext().getContentResolver().query(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, cols, null, null, MediaStore.Images.Media.DATE_ADDED + " DESC");
                if (c != null) {
                  int ci = c.getColumnIndex(MediaStore.Images.Media._ID);
                  int cd = c.getColumnIndex(MediaStore.Images.Media.DATA);
                  while (c.moveToNext()) {
                    String p = c.getString(cd);
                    if (p == null) continue;
                    JSObject o = new JSObject();
                    o.put("path", p);
                    o.put("uri", ContentUris.withAppendedId(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, c.getLong(ci)).toString());
                    arr.put(o);
                  }
                  c.close();
                }
                JSObject res = new JSObject();
                res.put("fotos", arr);
                call.resolve(res);
              } catch (Exception e) {
                call.reject("Erro ao ler a galeria: " + e.getMessage());
              }
            }
          }
          EOF
          cat > $D/MainActivity.java <<'EOF'
          package com.tobias.galeria;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(GaleriaPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          EOF
          sed -i 's|<application|<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" /><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" /><application|' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Montar o APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: galeria-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
