# LUMI v12 - se você está vendo esta linha, é o arquivo certo
name: Lumi v12 - Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Criar arquivos do app v12
        shell: bash
        run: |
          set -e
          mkdir -p www
          cat > www/index.html <<'FILE_index_html'
          <!doctype html>
          <html lang="pt-BR"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <link rel="stylesheet" href="style.css">
          </head><body>
          <div id="sp"><svg viewBox="18 18 72 72" xmlns="http://www.w3.org/2000/svg"><g transform="rotate(-12 54 54)"><path fill="#454B53" d="M41,30 H67 A7,7 0 0 1 74,37 V71 A7,7 0 0 1 67,78 H41 A7,7 0 0 1 34,71 V37 A7,7 0 0 1 41,30 Z"/></g><g transform="rotate(6 54 54)"><path fill="#FFC531" d="M41,30 H67 A7,7 0 0 1 74,37 V71 A7,7 0 0 1 67,78 H41 A7,7 0 0 1 34,71 V37 A7,7 0 0 1 41,30 Z"/><path fill="#1B1400" d="M39,71 L49.5,55 L56,64.5 L61,58 L69,71 Z"/><path fill="#1B1400" d="M63,39.5 A4.5,4.5 0 1 1 63,48.5 A4.5,4.5 0 1 1 63,39.5 Z"/></g><path fill="#FFFFFF" d="M33,29 L34.6,32.4 L38,34 L34.6,35.6 L33,39 L31.4,35.6 L28,34 L31.4,32.4 Z"/></svg><b>Lumi</b><span>suas fotos, em ordem</span></div>
          <div id="hd"><h1>Lumi</h1><p class="sub">Carregando…</p></div>
          <p id="m"></p><div id="pb"><i></i></div><div id="app"></div><p id="dx"></p>
          <div id="cta"><button id="ctab"></button></div>
          <div id="vw"><div id="vt"><button id="vx">✕</button><span id="vc"></span><span class="vb"><button id="vn">ⓘ</button><button id="vd">🗑</button></span></div><img id="vim" alt=""><button id="vp">▶ Reproduzir</button><div id="vi"></div></div>
          <script src="app.js"></script>
          </body></html>
          FILE_index_html
          cat > www/style.css <<'FILE_style_css'
          *{box-sizing:border-box}
          :root{color-scheme:dark;--bg:#0c0d0f;--s1:#17191c;--s2:#212428;--tx:#f2f3f4;--mu:#8d9399;--ac:#ffc531;--acx:#1b1400}
          body{margin:0;font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);padding:calc(env(safe-area-inset-top,0px) + 14px) 12px 44px}
          body.viewer-open{overflow:hidden}body.cta-on{padding-bottom:140px}
          h1{font-size:1.9rem;margin:0;font-weight:800;letter-spacing:-.02em}.sub{color:var(--mu);margin:4px 0 14px;font-size:.92rem}
          button{font:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
          .pri{display:block;width:100%;background:var(--ac);color:var(--acx);border-radius:28px;padding:16px 14px;font-weight:800;font-size:1.04rem}
          .seg{display:flex;background:var(--s1);border-radius:16px;padding:4px;margin:14px 0 12px}.seg button{flex:1;padding:10px;border-radius:12px;background:transparent;color:var(--mu);font-weight:700;font-size:.92rem}.seg button.on{background:var(--s2);color:var(--tx)}
          .tool{display:flex;align-items:center;gap:12px;background:var(--s1);border-radius:18px;padding:13px 14px;width:100%;text-align:left;color:var(--tx);margin-bottom:14px}.tool .ic{width:44px;height:44px;border-radius:14px;background:var(--s2);color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:1.35rem;flex:none}.tool .bx{display:flex;flex-direction:column;min-width:0}.tool b{font-size:1rem}.tool .bx span{color:var(--mu);font-size:.82rem;margin-top:2px}.tool .ar{margin-left:auto;color:var(--mu);font-size:1.6rem}
          #m{color:var(--ac);margin:7px 2px;min-height:1.1em;font-size:.88rem}.sh{margin:20px 2px 8px;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);font-weight:800}
          #pb{display:none;height:5px;background:var(--s2);border-radius:8px;overflow:hidden;margin:4px 0 9px}#pb i{display:block;height:100%;width:0;background:var(--ac);transition:width .12s linear}
          #dx{color:#555b61;font-size:.7rem;margin-top:25px}.vazio,.nota{color:var(--mu);font-size:.9rem;margin:14px 2px;line-height:1.4}
          .albums{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{position:relative;aspect-ratio:1.1;border-radius:18px;overflow:hidden;background:var(--s1);padding:0;color:#fff;text-align:left}.card img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}.card .t{position:absolute;left:0;right:0;bottom:0;padding:36px 12px 11px;background:linear-gradient(transparent,rgba(0,0,0,.82));display:flex;flex-direction:column}.card .t b{font-size:1rem;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.card .t span{font-size:.8rem;color:#d3d7da;margin-top:2px}
          .top{position:sticky;top:0;z-index:20;background:var(--bg);margin:calc(-1*(env(safe-area-inset-top,0px) + 14px)) -12px 0;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 4px}.top .sub{margin:0 0 8px 4px}
          .tb{display:flex;align-items:center;gap:4px;min-height:52px}.ib{flex:none;width:46px;height:46px;border-radius:23px;background:transparent;color:var(--tx);font-size:1.55rem;line-height:1}.tt{flex:1;font-size:1.5rem;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
          .chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{flex:none;border-radius:18px;padding:8px 14px;background:var(--s2);color:var(--tx);font-weight:700;font-size:.86rem}.chip.on{background:var(--ac);color:var(--acx)}
          .dh{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}.dh .d{font-size:1.3rem;color:var(--mu);font-weight:600}.dh .r{display:flex;align-items:center}.dh .z{color:var(--mu);font-size:1rem}
          .ck{display:none;width:30px;height:30px;border-radius:15px;border:2px solid #7a8087;align-items:center;justify-content:center;color:transparent;font-size:1rem;font-weight:800;flex:none}
          #app.sel .dh .ck{display:inline-flex;margin-left:12px}.dh .ck.on{background:var(--ac);border-color:var(--ac);color:var(--acx)}
          .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
          .tile{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--s1)}.tile img{width:100%;height:100%;object-fit:cover;display:block}
          .tile .sz,.tile .vd{position:absolute;bottom:5px;font-size:.7rem;font-weight:700;color:#fff;text-shadow:0 1px 3px #000,0 0 7px rgba(0,0,0,.85);pointer-events:none}.tile .sz{right:6px}.tile .vd{left:6px}
          .tile .ck{position:absolute;right:6px;top:6px;background:rgba(0,0,0,.3)}#app.sel .tile .ck{display:inline-flex}.tile.on .ck{background:var(--ac);border-color:var(--ac);color:var(--acx)}.tile.on{outline:3px solid var(--ac);outline-offset:-3px}
          .tile .keep{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.6);color:#fff;font-size:.68rem;font-weight:800;padding:2px 8px;border-radius:10px;pointer-events:none}.tile.on .keep{display:none}
          .dg{background:var(--s1);border-radius:18px;padding:12px;margin:0 0 12px}.dg h3{margin:0 0 10px;font-size:.95rem;font-weight:700}
          .mais{width:100%;margin-top:14px;padding:14px;border-radius:16px;background:var(--s2);color:var(--tx);font-weight:700}
          #cta{display:none;position:fixed;left:0;right:0;bottom:0;padding:28px 16px calc(env(safe-area-inset-bottom,0px) + 14px);background:linear-gradient(transparent,var(--bg) 40%);z-index:30}#cta button{width:100%;padding:17px;border-radius:30px;background:var(--ac);color:var(--acx);font-weight:800;font-size:1.15rem}
          #vw{position:fixed;left:0;top:0;right:0;bottom:0;background:#000;display:none;align-items:center;justify-content:center;z-index:99;touch-action:none}#vw img{max-width:100%;max-height:100%;object-fit:contain;transition:opacity .12s}
          #vt{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;background:linear-gradient(rgba(0,0,0,.75),transparent);z-index:2}#vt button{background:rgba(25,25,25,.65);color:#fff;border-radius:22px;padding:9px 14px;font-size:1rem;backdrop-filter:blur(5px)}#vc{color:#fff;font-size:.88rem;font-weight:700;text-shadow:0 1px 4px #000}
          #vp{display:none;position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);left:50%;transform:translateX(-50%);background:var(--ac);color:var(--acx);font-weight:800;border-radius:28px;padding:14px 26px;font-size:1rem;z-index:3}
          #vim{transform-origin:center center;will-change:transform;-webkit-user-drag:none;user-select:none}#vim.anim{transition:opacity .12s,transform .22s ease}#vt,#vp{transition:opacity .2s}#vw.hid #vt,#vw.hid #vp{opacity:0;pointer-events:none}.vb{display:flex;gap:8px}#vw.info #vp{display:none!important}
          #vi{display:none;position:absolute;left:0;right:0;bottom:0;max-height:64%;overflow:auto;background:rgba(10,16,20,.97);border-radius:20px 20px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 20px);z-index:5;font-size:.86rem;line-height:1.45;color:#edf3f6;touch-action:pan-y}#vi h4{margin:14px 0 5px;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:#8296a2}#vi h4:first-child{margin-top:0}#vi .k{color:#91a3ae}#vi .tag{display:inline-block;background:#19262d;border-radius:10px;padding:3px 9px;margin:2px 5px 2px 0;font-size:.78rem}#vi .ok{color:var(--ac);font-weight:800}
          #sp{position:fixed;left:0;top:0;right:0;bottom:0;z-index:300;background:#0c0d0f;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s ease}#sp.out{opacity:0;pointer-events:none}#sp svg{width:150px;height:150px;animation:spop .7s ease both}#sp b{font-size:2rem;letter-spacing:-.02em;margin-top:14px}#sp span{color:#8d9399;font-size:.95rem;margin-top:4px}@keyframes spop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
