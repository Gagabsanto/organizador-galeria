            // Impressão digital da imagem (dHash 64 bits): duas fotos iguais ou reduzidas dão hashes quase iguais.
            private String dHash(Bitmap b) {
              Bitmap m = Bitmap.createScaledBitmap(b, 144, 128, true);
              Bitmap s = Bitmap.createScaledBitmap(m, 72, 64, true);
              int[] px = new int[72 * 64];
              s.getPixels(px, 0, 72, 0, 0, 72, 64);
              double[][] g = new double[8][9];
              for (int cy = 0; cy < 8; cy++) {
                for (int cx = 0; cx < 9; cx++) {
                  double soma = 0;
                  for (int y = 0; y < 8; y++) {
                    for (int x = 0; x < 8; x++) {
                      int p = px[(cy * 8 + y) * 72 + cx * 8 + x];
                      soma += 0.299 * ((p >> 16) & 255) + 0.587 * ((p >> 8) & 255) + 0.114 * (p & 255);
                    }
                  }
                  g[cy][cx] = soma / 64.0;
                }
              }
              long h = 0;
              for (int cy = 0; cy < 8; cy++) {
                for (int cx = 0; cx < 8; cx++) {
                  h <<= 1;
                  if (g[cy][cx] > g[cy][cx + 1]) h |= 1L;
                }
              }
              if (s != m) s.recycle();
              if (m != b) m.recycle();
              StringBuilder hex = new StringBuilder(Long.toHexString(h));
              while (hex.length() < 16) hex.insert(0, '0');
              return hex.toString();
            }

            private double brilhoDe(Bitmap b) {
              Bitmap s = Bitmap.createScaledBitmap(b, 24, 24, true);
              int[] px = new int[24 * 24];
              s.getPixels(px, 0, 24, 0, 0, 24, 24);
              double soma = 0;
              for (int p : px) {
                int r = (p >> 16) & 255;
                int g = (p >> 8) & 255;
                int bl = p & 255;
                soma += (0.299 * r + 0.587 * g + 0.114 * bl) / 255.0;
              }
              if (s != b) s.recycle();
              return Math.round(soma / px.length * 100) / 100.0;
            }

